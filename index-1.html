
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="GBK">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概率已匹配官方数据 CF Season Pass S7赛季通行证-模拟测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }

        /* 全局验证密码区 */
        .password-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* 模拟器提示文字 */
        .sim-tip {
            color: #ff0000;
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* 活动链接按钮 */
        .act-link-btn {
            padding: 12px 40px;
            font-size: 18px;
            background-color: #2196F3;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
            text-decoration: none;
        }

        .act-link-btn:hover {
            background-color: #64B5F6;
        }

        .password-input {
            padding: 15px 20px;
            font-size: 18px;
            width: 300px;
            margin-bottom: 20px;
            border: 2px solid #4e54c8;
            border-radius: 8px;
            background-color: #2d2d44;
            color: #fff;
            outline: none;
        }

        .password-btn {
            padding: 12px 40px;
            font-size: 18px;
            background-color: #4e54c8;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .password-btn:hover {
            background-color: #6a6fd8;
        }

        .error-tip {
            color: #ff4444;
            margin-top: 10px;
            display: none;
        }

        /* 主容器 */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: none;
        }

        /* 用户信息区 */
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d2d44;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .level-info {
            display: flex;
            flex-direction: column;
        }

        .level-title {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .level-bar {
            width: 300px;
            height: 20px;
            background-color: #444;
            border-radius: 10px;
            overflow: hidden;
        }

        .level-progress {
            height: 100%;
            background-color: #4e54c8;
            width: 0%;
            transition: width 0.3s;
        }

        .badge-info {
            font-size: 18px;
        }

        .key-info {
            font-size: 18px;
        }

        /* 钥匙购买区 - 改为充值入口 */
        .key-shop {
            background-color: #2d2d44;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .shop-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4e54c8;
        }

        .key-btn {
            padding: 10px 20px;
            margin-right: 15px;
            background-color: #ff9800;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .key-btn:hover {
            background-color: #ffb74d;
        }

        /* 抽奖区 */
        .lottery-container {
            background-color: #2d2d44;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .lottery-title {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #4e54c8;
        }

        .lottery-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .lottery-item {
            background-color: #3d3d5c;
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .lottery-item:hover {
            transform: scale(1.05);
        }

        .item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .item-name {
            font-size: 14px;
            color: #eee;
        }

        /* 抽奖按钮区 */
        .lottery-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .lottery-btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .single-btn {
            background-color: #4e54c8;
            color: #fff;
        }

        .ten-btn {
            background-color: #e91e63;
            color: #fff;
        }

        .lottery-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .lottery-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        /* 抽奖结果弹窗 */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background-color: #2d2d44;
            border-radius: 10px;
            padding: 20px;
            max-width: 90%;
            width: 800px;
            text-align: center;
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4e54c8;
        }

        .result-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background-color: #3d3d5c;
            padding: 10px;
            border-radius: 8px;
        }

        .result-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .result-name {
            font-size: 16px;
            color: #eee;
        }

        .close-btn {
            padding: 10px 30px;
            background-color: #4e54c8;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .close-btn:hover {
            background-color: #6a6fd8;
        }

        /* 统计区 */
        .stats-container {
            background-color: #2d2d44;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .stats-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4e54c8;
        }

        .stats-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .badge-stats, .level-stats {
            flex: 1;
            min-width: 300px;
            background-color: #3d3d5c;
            padding: 15px;
            border-radius: 8px;
        }

        .stats-item {
            margin-bottom: 10px;
            font-size: 16px;
        }

        /* 配置区 - 默认隐藏，验证后显示 */
        .config-container {
            background-color: #2d2d44;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none; /* 默认隐藏 */
        }

        /* 配置验证密码区 */
        .config-password-container {
            background-color: #2d2d44;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .config-pwd-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4e54c8;
        }

        .config-password-input {
            padding: 10px 15px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 15px;
            border: 2px solid #4e54c8;
            border-radius: 8px;
            background-color: #3d3d5c;
            color: #fff;
            outline: none;
        }

        .config-password-btn {
            padding: 10px 30px;
            background-color: #4e54c8;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .config-password-btn:hover {
            background-color: #6a6fd8;
        }

        .config-error-tip {
            color: #ff4444;
            margin-top: 10px;
            display: none;
        }

        .config-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4e54c8;
        }

        .level-config {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
        }

        .config-label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .config-input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #4e54c8;
            background-color: #3d3d5c;
            color: #fff;
            outline: none;
        }

        .save-config {
            padding: 10px 20px;
            background-color: #4e54c8;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }

        .save-config:hover {
            background-color: #6a6fd8;
        }

        /* 概率配置 */
        .prob-config {
            margin-top: 20px;
        }

        .prob-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .prob-label {
            width: 150px;
            font-size: 16px;
        }

        .prob-input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #4e54c8;
            background-color: #3d3d5c;
            color: #fff;
            outline: none;
            width: 100px;
            margin-right: 10px;
        }

        .prob-tip {
            color: #999;
            font-size: 14px;
        }

        /* 导入导出按钮样式 */
        .import-btn {
            padding: 10px 20px;
            background-color: #2196F3;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .import-btn:hover {
            background-color: #64B5F6;
        }

        /* 文件上传相关隐藏 */
        .file-input {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 全局验证密码区域 -->
    <div class="password-container" id="passwordContainer">
        <!-- 模拟器提示文字 -->
        <div class="sim-tip">网页内容仅供参考，内部测试页面，请勿泄露链接</div>
        <!-- 活动链接按钮 -->
        <a href="https://qun.qq.com/universal-share/share?ac=1&authKey=E3yNVWUOPI2ixwKfD5SO47s8V%2B2gdUytnJmyVVIMGydl4nyxUCp24IX7SXaH3YQT&busi_data=eyJncm91cENvZGUiOiIxMDc1OTUwMzAyIiwidG9rZW4iOiJmekVKT2RxWHRiRlN5TURDVzR4WDgwWkFLOHlYTjRjN1UwOUttclM5UEs1MStwdFBCTktTZ01ySnlRV0dZV0VUIiwidWluIjoiMTQzNjI1MDc2NCJ9&data=mtb29KWOBuatHaCrAwLbOJTl5f8aFj-Im1HB0aIVVQeQ8S0IETBzZWIlgUzRdDrv_rgL9VZ2Id2WI71am29p-A&svctype=4&tempid=h5_group_info" target="_blank" class="act-link-btn">加入内部测试群</a>
        <input type="password" class="password-input" id="passwordInput" placeholder="请输入登陆密码">
        <button class="password-btn" id="passwordBtn">确定登陆</button>
        <div class="error-tip" id="errorTip">密码错误，请重新输入！</div>
    </div>

    <!-- 主容器 -->
    <div class="main-container" id="mainContainer">
        <!-- 用户信息区 -->
        <div class="user-info">
            <div class="level-info">
                <div class="level-title">等级: <span id="userLevel">1</span> (经验: <span id="userExp">0</span>/100)</div>
                <div class="level-bar">
                    <div class="level-progress" id="levelProgress"></div>
                </div>
            </div>
            <div class="badge-info">徽章数量: <span id="badgeCount">0</span></div>
            <div class="key-info">钥匙数量: <span id="keyCount">10</span></div>
        </div>

        <!-- 钥匙充值区 -->
        <div class="key-shop">
            <div class="shop-title">钥匙充值</div>
            <button class="key-btn" data-count="1" data-cost="10">充值1个钥匙 (10Q币)</button>
            <button class="key-btn" data-count="11" data-cost="100">充值11个钥匙 (100Q币)</button>
            <button class="key-btn" data-count="55" data-cost="500">充值55个钥匙 (500Q币)</button>
        </div>

        <!-- 抽奖区 -->
        <div class="lottery-container">
            <div class="lottery-title">CF Season Pass S7概率已匹配官方数据</div>
            <div class="lottery-grid" id="lotteryGrid">
                <!-- 抽奖奖品由JS动态生成 -->
            </div>
            <div class="lottery-btns">
                <button class="lottery-btn single-btn" id="singleDrawBtn">单抽 (消耗1钥匙)</button>
                <button class="lottery-btn ten-btn" id="tenDrawBtn">十连抽 (消耗10钥匙)</button>
            </div>
        </div>

        <!-- 统计区 -->
        <div class="stats-container">
            <div class="stats-title">数据统计</div>
            <div class="stats-content">
                <div class="badge-stats">
                    <div class="stats-item">等级获得徽章数量: <span id="badgeFromLevel">0</span></div>
                    <div class="stats-item">抽奖获得徽章数量: <span id="badgeFromLottery">0</span></div>
                    <div class="stats-item">徽章总获取数: <span id="badgeTotalGain">0</span></div>
                    <div class="stats-item">徽章总消耗数: <span id="badgeTotalCost">0</span></div>
                </div>
                <div class="level-stats">
                    <div class="stats-item">总抽奖次数: <span id="totalDrawCount">0</span></div>
                    <div class="stats-item">总获取经验: <span id="totalExpGain">0</span></div>
                    <div class="stats-item">升级次数: <span id="levelUpCount">0</span></div>
                    <div class="stats-item">当前等级徽章奖励: <span id="currentLevelBadge">0</span></div>
                </div>
            </div>
        </div>

        <!-- 配置验证密码区 - 显示在统计区下方 -->
        <div class="config-password-container" id="configPasswordContainer">
            <div class="config-pwd-title">配置模式验证</div>
            <input type="password" class="config-password-input" id="configPasswordInput" placeholder="请输入配置验证密码">
            <button class="config-password-btn" id="configPasswordBtn">验证并进入配置</button>
            <div class="config-error-tip" id="configErrorTip">密码错误，请重新输入！</div>
        </div>

        <!-- 配置区 - 默认隐藏 -->
        <div class="config-container" id="configContainer">
            <div class="config-title">等级徽章奖励配置 (1-135级)</div>
            <!-- 导入配置按钮 -->
            <button class="import-btn" id="importBadgeBtn">导入等级配置数据 (TXT)</button>
            <input type="file" class="file-input" id="badgeFileInput" accept=".txt">
            <div class="level-config" id="levelConfig"></div>
            <button class="save-config" id="saveConfigBtn">保存等级配置</button>

            <div class="prob-config">
                <div class="config-title">抽奖概率配置 (总和必须为100%)</div>
                <!-- 导入概率按钮 -->
                <button class="import-btn" id="importProbBtn">导入概率配置数据 (TXT)</button>
                <input type="file" class="file-input" id="probFileInput" accept=".txt">
                <div id="probConfigContainer">
                    <!-- 概率配置由JS生成 -->
                </div>
                <button class="save-config" id="saveProbBtn">保存概率配置</button>
                <div class="prob-tip" id="probTip">当前概率总和: <span id="probSum">100</span>%</div>
            </div>
        </div>
    </div>

    <!-- 抽奖结果弹窗 -->
    <div class="result-modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">抽奖结果</div>
            <div class="result-items" id="resultItems">
                <!-- 抽奖结果由JS动态生成 -->
            </div>
            <button class="close-btn" id="closeModalBtn">关闭</button>
        </div>
    </div>

    <script>
        // 全局配置
        const APP_CONFIG = {
            PASSWORD: "xiaozhi", // 全局验证密码
            CONFIG_PASSWORD: "xiaozhi", // 配置模式密码
            EXP_PER_LEVEL: 100, // 每级需要的经验
            MAX_LEVEL: 135,     // 最高等级
            // 奖品配置 (14个奖品,前9个为物品类奖励徽章,后5个为经验类奖励)
            PRIZES: [
                { id: 1, name: "幻神-KZ-CFPL S25冠军 皮肤", type: "item", img: "/images/1.png", badge: 5, prob: 0.15 },
                { id: 2, name: "白虎-拼搏 皮肤", type: "item", img: "/images/2.png", badge: 8, prob: 0.20 },
                { id: 3, name: "星神-拼搏 皮肤", type: "item", img: "/images/3.png", badge: 10, prob: 0.20 },
                { id: 4, name: "QBZ03-巅峰荣耀皮肤", type: "item", img: "/images/4.png", badge: 12, prob: 0.25 },
                { id: 5, name: "炽芒蝶刃-冠军炽芒皮肤", type: "item", img: "/images/5.png", badge: 15, prob: 0.25 },
                { id: 6, name: "火麒麟-拼搏 皮肤", type: "item", img: "/images/6.png", badge: 18, prob: 0.40 },
                { id: 7, name: "毁灭-冠军之怒", type: "item", img: "/images/7.png", badge: 20, prob: 0.40 },
                { id: 8, name: "火麒麟-AG战队皮肤", type: "item", img: "/images/8.png", badge: 25, prob: 0.60 },
                { id: 9, name: "CFPL C4皮肤", type: "item", img: "/images/9.png", badge: 30, prob: 1.20 },
                { id: 10, name: "100经验值", type: "exp", img: "/images/10.png", exp: 100, prob: 48.65 },
                { id: 11, name: "150经验值", type: "exp", img: "/images/11.png", exp: 150, prob: 36.00 },
                { id: 12, name: "200经验值", type: "exp", img: "/images/12.png", exp: 200, prob: 10.00 },
                { id: 13, name: "500经验值", type: "exp", img: "/images/13.png", exp: 500, prob: 1.20 },
                { id: 14, name: "1000经验值", type: "exp", img: "/images/14.png", exp: 1000, prob: 0.50 }
            ]
        };

        // 用户数据结构
        let userData = {
            level: 1,          // 当前等级
            exp: 0,            // 当前经验
            badges: 0,         // 徽章数量
            keys: 10,          // 钥匙数量
            levelBadgeConfig: {}, // 各等级徽章奖励配置
            lotteryStats: {    // 抽奖统计
                totalDraws: 0,
                totalExpGain: 0,
                totalBadgeGain: 0,
                badgeFromLevel: 0,
                badgeFromLottery: 0,
                badgeTotalCost: 0,
                levelUpCount: 0
            }
        };

        // 初始化本地存储
        function initLocalStorage() {
            const savedData = localStorage.getItem('lotteryUserData');
            if (savedData) {
                try {
                    userData = JSON.parse(savedData);
                } catch (e) {
                    console.error('读取用户数据失败，使用默认数据', e);
                    resetUserData();
                }
            } else {
                // 初始化等级徽章奖励配置 (默认每级10个)
                for (let i = 1; i <= APP_CONFIG.MAX_LEVEL; i++) {
                    userData.levelBadgeConfig[i] = 10;
                }
                saveUserData();
            }

            // 初始化概率配置
            const savedProb = localStorage.getItem('lotteryProbConfig');
            if (!savedProb) {
                const probConfig = APP_CONFIG.PRIZES.map(prize => ({
                    id: prize.id,
                    prob: prize.prob
                }));
                localStorage.setItem('lotteryProbConfig', JSON.stringify(probConfig));
            }
        }

        // 保存用户数据到本地存储
        function saveUserData() {
            localStorage.setItem('lotteryUserData', JSON.stringify(userData));
            updateUI();
        }

        // 重置用户数据
        function resetUserData() {
            userData = {
                level: 1,
                exp: 0,
                badges: 0,
                keys: 10,
                levelBadgeConfig: {},
                lotteryStats: {
                    totalDraws: 0,
                    totalExpGain: 0,
                    totalBadgeGain: 0,
                    badgeFromLevel: 0,
                    badgeFromLottery: 0,
                    badgeTotalCost: 0,
                    levelUpCount: 0
                }
            };
            for (let i = 1; i <= APP_CONFIG.MAX_LEVEL; i++) {
                userData.levelBadgeConfig[i] = 10;
            }
            saveUserData();
        }

        // 更新UI显示
        function updateUI() {
            // 更新等级信息
            document.getElementById('userLevel').textContent = userData.level;
            document.getElementById('userExp').textContent = userData.exp;
            const progressPercent = (userData.exp / APP_CONFIG.EXP_PER_LEVEL) * 100;
            document.getElementById('levelProgress').style.width = `${progressPercent}%`;

            // 更新徽章和钥匙数量
            document.getElementById('badgeCount').textContent = userData.badges;
            document.getElementById('keyCount').textContent = userData.keys;

            // 更新统计信息
            document.getElementById('badgeFromLevel').textContent = userData.lotteryStats.badgeFromLevel;
            document.getElementById('badgeFromLottery').textContent = userData.lotteryStats.badgeFromLottery;
            document.getElementById('badgeTotalGain').textContent = userData.lotteryStats.totalBadgeGain;
            document.getElementById('badgeTotalCost').textContent = userData.lotteryStats.badgeTotalCost;
            document.getElementById('totalDrawCount').textContent = userData.lotteryStats.totalDraws;
            document.getElementById('totalExpGain').textContent = userData.lotteryStats.totalExpGain;
            document.getElementById('levelUpCount').textContent = userData.lotteryStats.levelUpCount;
            document.getElementById('currentLevelBadge').textContent = userData.levelBadgeConfig[userData.level] || 0;

            // 更新抽奖按钮状态
            document.getElementById('singleDrawBtn').disabled = userData.keys < 1;
            document.getElementById('tenDrawBtn').disabled = userData.keys < 10;
        }

        // 生成抽奖格子
        function generateLotteryGrid() {
            const grid = document.getElementById('lotteryGrid');
            grid.innerHTML = '';

            APP_CONFIG.PRIZES.forEach(prize => {
                const item = document.createElement('div');
                item.className = 'lottery-item';
                item.innerHTML = `
                    <img src="${prize.img}" alt="${prize.name}" class="item-img">
                    <div class="item-name">${prize.name}</div>
                `;
                grid.appendChild(item);
            });
        }

        // 生成等级配置项
        function generateLevelConfig() {
            const configContainer = document.getElementById('levelConfig');
            configContainer.innerHTML = '';

            for (let i = 1; i <= APP_CONFIG.MAX_LEVEL; i++) {
                const configItem = document.createElement('div');
                configItem.className = 'config-item';
                configItem.innerHTML = `
                    <label class="config-label">${i}级</label>
                    <input type="number" class="config-input level-badge-input" 
                           data-level="${i}" 
                           value="${userData.levelBadgeConfig[i] || 10}"
                           min="0">
                `;
                configContainer.appendChild(configItem);
            }
        }

        // 生成概率配置项
        function generateProbConfig() {
            const probContainer = document.getElementById('probConfigContainer');
            probContainer.innerHTML = '';

            const savedProb = JSON.parse(localStorage.getItem('lotteryProbConfig')) || [];
            
            APP_CONFIG.PRIZES.forEach(prize => {
                const probData = savedProb.find(p => p.id === prize.id) || { id: prize.id, prob: prize.prob };
                
                const probItem = document.createElement('div');
                probItem.className = 'prob-item';
                probItem.innerHTML = `
                    <label class="prob-label">${prize.name}:</label>
                    <input type="number" class="prob-input" 
                           data-id="${prize.id}" 
                           value="${probData.prob}"
                           min="0" max="100" step="0.1">
                    <span class="prob-tip">%</span>
                `;
                probContainer.appendChild(probItem);
            });

            // 计算概率总和
            calculateProbSum();
        }

        // 计算概率总和
        function calculateProbSum() {
            const probInputs = document.querySelectorAll('.prob-input');
            let sum = 0;
            probInputs.forEach(input => {
                sum += parseFloat(input.value) || 0;
            });
            document.getElementById('probSum').textContent = sum.toFixed(1);
            return sum;
        }

        // 等级提升处理
        function handleLevelUp() {
            if (userData.level >= APP_CONFIG.MAX_LEVEL) return;

            while (userData.exp >= APP_CONFIG.EXP_PER_LEVEL) {
                // 扣除升级所需经验
                userData.exp -= APP_CONFIG.EXP_PER_LEVEL;
                
                // 等级提升
                userData.level++;
                
                // 添加等级徽章奖励
                const badgeReward = userData.levelBadgeConfig[userData.level] || 0;
                userData.badges += badgeReward;
                
                // 更新统计
                userData.lotteryStats.badgeFromLevel += badgeReward;
                userData.lotteryStats.totalBadgeGain += badgeReward;
                userData.lotteryStats.levelUpCount++;

                // 最高等级处理
                if (userData.level >= APP_CONFIG.MAX_LEVEL) {
                    userData.exp = 0;
                    break;
                }
            }

            saveUserData();
        }

        // 随机抽取奖品
        function drawPrize() {
            const probConfig = JSON.parse(localStorage.getItem('lotteryProbConfig')) || [];
            
            // 构建概率池
            let probPool = [];
            let totalProb = 0;
            
            APP_CONFIG.PRIZES.forEach(prize => {
                const probData = probConfig.find(p => p.id === prize.id) || { prob: prize.prob };
                const prob = parseFloat(probData.prob) || 0;
                totalProb += prob;
                
                // 放大10倍处理小数概率
                for (let i = 0; i < prob * 10; i++) {
                    probPool.push(prize);
                }
            });

            // 随机抽取
            const randomIndex = Math.floor(Math.random() * probPool.length);
            const prize = probPool[randomIndex] || APP_CONFIG.PRIZES[0];

            // 处理奖品
            if (prize.type === 'exp') {
                // 经验类奖品
                userData.exp += prize.exp;
                userData.lotteryStats.totalExpGain += prize.exp;
                handleLevelUp();
            } else {
                // 物品类奖品奖励徽章
                userData.badges += prize.badge;
                userData.lotteryStats.badgeFromLottery += prize.badge;
                userData.lotteryStats.totalBadgeGain += prize.badge;
            }

            return prize;
        }

        // 单抽
        function singleDraw() {
            if (userData.keys < 1) return;

            // 扣除钥匙
            userData.keys--;
            
            // 抽奖
            const prize = drawPrize();
            
            // 更新统计
            userData.lotteryStats.totalDraws++;
            
            // 显示结果弹窗
            showResultModal([prize], '本次抽奖结果');
            
            saveUserData();
        }

        // 十连抽
        function tenDraw() {
            if (userData.keys < 10) return;

            // 扣除钥匙
            userData.keys -= 10;
            
            // 抽奖10次
            const prizes = [];
            for (let i = 0; i < 10; i++) {
                prizes.push(drawPrize());
            }
            
            // 更新统计
            userData.lotteryStats.totalDraws += 10;
            
            // 显示结果弹窗
            showResultModal(prizes, '十连抽结果');
            
            saveUserData();
        }

        // 显示抽奖结果弹窗
        function showResultModal(prizes, title) {
            const modal = document.getElementById('resultModal');
            const modalTitle = document.getElementById('modalTitle');
            const resultItems = document.getElementById('resultItems');

            // 设置标题
            modalTitle.textContent = title;
            
            // 生成结果项
            resultItems.innerHTML = '';
            prizes.forEach(prize => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <img src="${prize.img}" alt="${prize.name}" class="result-img">
                    <div class="result-name">${prize.name}</div>
                `;
                resultItems.appendChild(item);
            });

            // 显示弹窗
            modal.style.display = 'flex';
        }

        // 充值钥匙
        function buyKeys(count, cost) {
            // 这里仅做模拟，实际项目中需要对接支付接口
            userData.keys += count;
            saveUserData();
            alert(`成功充值${count}个钥匙 (${cost}Q币)！`);
        }

        // 导入徽章配置数据
        function importBadgeData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // 读取文件数据并去除空格
                    const content = e.target.result.trim();
                    // 匹配 #数字1 #数字2 ... 格式
                    const regex = /^#(\d+(?:\s+#\d+)*)$/;
                    if (!regex.test(content)) {
                        alert('配置数据格式错误，请确保格式为#数字1 #数字2 ... #数字135（空格分隔）');
                        return;
                    }
                    
                    // 提取数字
                    const nums = content.split('#').filter(item => item.trim()).map(item => parseInt(item.trim()));
                    if (nums.length !== APP_CONFIG.MAX_LEVEL) {
                        alert(`配置数据数量错误，需要${APP_CONFIG.MAX_LEVEL}个(1-135级)，当前${nums.length}个`);
                        return;
                    }
                    
                    // 验证数字合法性
                    for (let i = 0; i < nums.length; i++) {
                        if (isNaN(nums[i]) || nums[i] < 0) {
                            alert(`第${i+1}个数据不合法，请检查是否为非负整数`);
                            return;
                        }
                    }
                    
                    // 更新配置
                    for (let i = 0; i < nums.length; i++) {
                        userData.levelBadgeConfig[i+1] = nums[i];
                    }
                    
                    // 刷新配置UI
                    generateLevelConfig();
                    saveUserData();
                    alert('等级配置数据导入成功！');
                } catch (err) {
                    alert('导入配置数据失败：' + err.message);
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 导入概率配置数据
        function importProbData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // 读取文件数据并去除空格
                    const content = e.target.result.trim();
                    // 匹配 %数字1 %数字2 ... 格式
                    const regex = /^%(\d+(?:\.\d+)?(?:\s+%\d+(?:\.\d+)?)*)$/;
                    if (!regex.test(content)) {
                        alert('概率数据格式错误，请确保格式为%数字1 %数字2 ... %数字14（空格分隔）');
                        return;
                    }
                    
                    // 提取数字
                    const nums = content.split('%').filter(item => item.trim()).map(item => parseFloat(item.trim()));
                    if (nums.length !== APP_CONFIG.PRIZES.length) {
                        alert(`概率数据数量错误，需要${APP_CONFIG.PRIZES.length}个，当前${nums.length}个`);
                        return;
                    }
                    
                    // 验证数字合法性
                    for (let i = 0; i < nums.length; i++) {
                        if (isNaN(nums[i]) || nums[i] < 0 || nums[i] > 100) {
                            alert(`第${i+1}个概率值不合法，请检查是否为0-100之间的数字`);
                            return;
                        }
                    }
                    
                    // 验证总和
                    const sum = nums.reduce((a, b) => a + b, 0);
                    if (Math.abs(sum - 100) > 0.1) {
                        if (!confirm(`概率总和为${sum.toFixed(1)}%，不等于100%，是否继续导入？`)) {
                            return;
                        }
                    }
                    
                    // 更新概率配置
                    const probConfig = APP_CONFIG.PRIZES.map((prize, index) => ({
                        id: prize.id,
                        prob: nums[index]
                    }));
                    localStorage.setItem('lotteryProbConfig', JSON.stringify(probConfig));
                    
                    // 刷新概率UI
                    generateProbConfig();
                    alert('概率配置数据导入成功！');
                } catch (err) {
                    alert('导入概率数据失败：' + err.message);
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 保存等级配置
        function saveLevelConfig() {
            const inputs = document.querySelectorAll('.level-badge-input');
            inputs.forEach(input => {
                const level = parseInt(input.dataset.level);
                const value = parseInt(input.value) || 0;
                userData.levelBadgeConfig[level] = value;
            });
            saveUserData();
            alert('等级配置保存成功！');
        }

        // 保存概率配置
        function saveProbConfig() {
            const inputs = document.querySelectorAll('.prob-input');
            const probConfig = [];
            
            inputs.forEach(input => {
                const id = parseInt(input.dataset.id);
                const prob = parseFloat(input.value) || 0;
                probConfig.push({ id, prob });
            });
            
            // 验证总和
            const sum = calculateProbSum();
            if (Math.abs(sum - 100) > 0.1) {
                if (!confirm(`概率总和为${sum.toFixed(1)}%，不等于100%，是否继续保存？`)) {
                    return;
                }
            }
            
            localStorage.setItem('lotteryProbConfig', JSON.stringify(probConfig));
            alert('概率配置保存成功！');
        }

        // 初始化事件监听
        function initEventListeners() {
            // 全局密码验证
            document.getElementById('passwordBtn').addEventListener('click', function() {
                const password = document.getElementById('passwordInput').value;
                if (password === APP_CONFIG.PASSWORD) {
                    document.getElementById('passwordContainer').style.display = 'none';
                    document.getElementById('mainContainer').style.display = 'block';
                } else {
                    document.getElementById('errorTip').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('errorTip').style.display = 'none';
                    }, 2000);
                }
            });

            // 配置密码验证
            document.getElementById('configPasswordBtn').addEventListener('click', function() {
                const password = document.getElementById('configPasswordInput').value;
                if (password === APP_CONFIG.CONFIG_PASSWORD) {
                    document.getElementById('configContainer').style.display = 'block';
                    document.getElementById('configPasswordContainer').style.display = 'none';
                } else {
                    document.getElementById('configErrorTip').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('configErrorTip').style.display = 'none';
                    }, 2000);
                }
            });

            // 钥匙充值按钮
            document.querySelectorAll('.key-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const count = parseInt(this.dataset.count);
                    const cost = parseInt(this.dataset.cost);
                    buyKeys(count, cost);
                });
            });

            // 抽奖按钮
            document.getElementById('singleDrawBtn').addEventListener('click', singleDraw);
            document.getElementById('tenDrawBtn').addEventListener('click', tenDraw);

            // 关闭弹窗按钮
            document.getElementById('closeModalBtn').addEventListener('click', function() {
                document.getElementById('resultModal').style.display = 'none';
            });

            // 导入等级配置按钮
            document.getElementById('importBadgeBtn').addEventListener('click', function() {
                document.getElementById('badgeFileInput').click();
            });

            // 导入概率配置按钮
            document.getElementById('importProbBtn').addEventListener('click', function() {
                document.getElementById('probFileInput').click();
            });

            // 文件选择事件
            document.getElementById('badgeFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    importBadgeData(file);
                    this.value = ''; // 重置文件选择
                }
            });

            document.getElementById('probFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    importProbData(file);
                    this.value = ''; // 重置文件选择
                }
            });

            // 保存配置按钮
            document.getElementById('saveConfigBtn').addEventListener('click', saveLevelConfig);
            document.getElementById('saveProbBtn').addEventListener('click', saveProbConfig);

            // 概率输入框实时计算总和
            document.addEventListener('input', function(e) {
                if (e.target.classList.contains('prob-input')) {
                    calculateProbSum();
                }
            });
        }

        // 页面初始化
        function init() {
            initLocalStorage();
            generateLotteryGrid();
            generateLevelConfig();
            generateProbConfig();
            initEventListeners();
            updateUI();
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
